<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光栅卡</title>
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 90% at 50% 0%,#1a1f2b 0%,#0a0c11 55%,#05060a 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"Microsoft YaHei",sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{perspective:1200px}
  .card{position:relative;width:min(62vh,380px);aspect-ratio:5/7;border-radius:14px;
    transform-style:preserve-3d;cursor:grab;will-change:transform;
    box-shadow:0 22px 54px -18px rgba(0,0,0,.9);background:#101419}
  .frame{position:absolute;inset:0;border-radius:14px;background-position:center;
    background-size:cover;background-repeat:no-repeat;opacity:0}
  .ribs{position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:overlay;z-index:3;
    background-size:6px 100%;opacity:0.55;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.16) 1px,
      rgba(0,0,0,.16) 1px,rgba(0,0,0,.16) 2px,rgba(255,255,255,0) 2px,rgba(255,255,255,0) 6px)}
  .gloss{position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:screen;z-index:3;
    background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.16) 46%,
      rgba(255,255,255,.03) 55%,rgba(255,255,255,0) 70%);opacity:0.5}
  .foil{position:absolute;inset:-2px;border-radius:calc(14px + 2px);pointer-events:none;z-index:4;
    mix-blend-mode:screen;opacity:0.32;
    background:radial-gradient(110px 110px at 50% 50%,rgba(255,255,255,.45),rgba(255,255,255,0) 66%),
      conic-gradient(from 200deg at 50% 50%,rgba(255,0,128,.16),rgba(255,214,0,.15),
      rgba(0,255,196,.16),rgba(84,160,255,.16),rgba(200,80,255,.16),rgba(255,0,128,.16));
    filter:saturate(140%)}
  .shine{position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:overlay;z-index:4;
    background:linear-gradient(105deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.5) 46%,
      rgba(255,255,255,.06) 54%,rgba(255,255,255,0) 68%);
    background-size:240% 240%;background-position:30% 30%}
  .hint{position:fixed;bottom:22px;font-size:11px;color:#4e5666;letter-spacing:.2em}
</style>
</head>
<body>
<div id="stage"><div class="card" id="card"><div id="stack"></div><div class="ribs"></div><div class="gloss"></div><div class="foil"></div><div class="shine"></div></div></div>
<div class="hint">按 住 卡 片 左 右 转</div>
<script>
(function(){
  var FRAMES = ["data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20500%20700%22%3E%3Crect%20width%3D%22500%22%20height%3D%22700%22%20fill%3D%22%232b1b3d%22%2F%3E%3Ccircle%20cx%3D%22250%22%20cy%3D%22330%22%20r%3D%22130%22%20fill%3D%22%23f0d9a0%22%2F%3E%3Ctext%20x%3D%22250%22%20y%3D%22650%22%20font-size%3D%2226%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%3E%E5%B8%A7%3C%2Ftext%3E%3C%2Fsvg%3E","data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20500%20700%22%3E%3Crect%20width%3D%22500%22%20height%3D%22700%22%20fill%3D%22%2312283a%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22230%22%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%237fd0ff%22%2F%3E%3Ctext%20x%3D%22250%22%20y%3D%22650%22%20font-size%3D%2226%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%3E%E5%B8%A7%3C%2Ftext%3E%3C%2Fsvg%3E","data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20500%20700%22%3E%3Crect%20width%3D%22500%22%20height%3D%22700%22%20fill%3D%22%233a1a1a%22%2F%3E%3Cpath%20d%3D%22M250%20190%20l120%20210%20-240%200%20z%22%20fill%3D%22%23ffcf8a%22%2F%3E%3Ctext%20x%3D%22250%22%20y%3D%22650%22%20font-size%3D%2226%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%3E%E5%B8%A7%3C%2Ftext%3E%3C%2Fsvg%3E"];
  var CFG = { range: 38, soft: 0.25 };
  var card = document.getElementById('card'), stack = document.getElementById('stack');
  var els = [];
  FRAMES.forEach(function(src){
    var d = document.createElement('div');
    d.className = 'frame';
    d.style.backgroundImage = 'url("' + src + '")';
    stack.appendChild(d); els.push(d);
  });
  var rx = -4, ry = 0, drag = false, lx = 0, ly = 0, autoT = 0, lastMove = 0, manual = 0;
  function paint(){
    card.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    var n = els.length, R = CFG.range, span = (2 * R) / n;
    for (var i = 0; i < n; i++) {
      var c = -R + (i + 0.5) * span;
      var dist = Math.abs(ry - c) / span;
      var w = dist >= 1 ? 0 : (1 - dist);
      w = Math.pow(w, CFG.soft > 0.02 ? (4 - CFG.soft * 3) : 40);
      els[i].style.opacity = w.toFixed(3);
      els[i].style.zIndex = w > .02 ? 2 : 1;
    }
  }
  card.addEventListener('pointerdown', function(e){
    drag = true; manual = 1; lx = e.clientX; ly = e.clientY; card.style.cursor = 'grabbing';
    if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', function(e){
    var _r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX - _r.left) / _r.width * 100).toFixed(1) + '%');
    card.style.setProperty('--my', ((e.clientY - _r.top) / _r.height * 100).toFixed(1) + '%');
    if (!drag) return;
    ry += (e.clientX - lx) * 0.4;
    ry = Math.max(-CFG.range, Math.min(CFG.range, ry));
    rx += (e.clientY - ly) * 0.06;
    rx = Math.max(-18, Math.min(18, rx));
    lx = e.clientX; ly = e.clientY; manual = 1; lastMove = Date.now(); paint();
  });
  function stop(){ drag = false; card.style.cursor = 'grab'; }
  card.addEventListener('pointerup', stop);
  card.addEventListener('pointercancel', stop);
  function loop(){
    if (autoOn && !drag && Date.now() - lastMove > 1200) {
      autoT += 0.008;
      ry = Math.sin(autoT) * CFG.range * 0.92;
      rx = -4 + Math.sin(autoT * 0.6) * 3;
      card.style.setProperty('--mx', (50 + Math.sin(autoT * 1.3) * 38).toFixed(1) + '%');
      card.style.setProperty('--my', (50 + Math.cos(autoT * 1.7) * 30).toFixed(1) + '%');
      paint();
    }
    requestAnimationFrame(loop);
  }
  paint(); loop();
})();
</script>
</body>
</html>
